name: Release

# Publishes cross-platform binaries plus checksums.txt for a tag.
#
# The artifact names and the checksum manifest are what `elasticclaw upgrade`
# fetches, so this workflow is the update channel: pushing a tag is what makes a
# new version reachable by every installed client.
#
#   git tag 2026.7.24 && git push origin 2026.7.24
#
# Prerelease channels are supported: 2026.7.24-beta.1 is offered only to clients
# already on a beta, never to stable installs.

on:
  push:
    tags:
      # CalVer, matching this project's convention: 2026.7.24, 2026.7.24.1,
      # 2026.7.24-beta.1. Also accept a "v" prefix in case SemVer is adopted.
      - "[0-9]*"
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (must already exist)"
        required: true

permissions:
  contents: write # required to create the release and upload assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0 # build script uses git describe

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # No npm cache: web/package-lock.json is intentionally git-ignored, and
          # setup-node's cache requires a committed lockfile to key on. The root
          # package-lock.json is a stub and does not describe the web build.

      - name: Verify the tree builds and tests pass
        run: |
          go vet ./...
          go test ./...

      - name: Build release artifacts
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          # Bake this repository in as the self-update source, so a fork's
          # binaries upgrade from the fork rather than from upstream.
          RELEASE_REPO: ${{ github.repository }}
        run: scripts/build-release.sh

      - name: Verify the updater's asset contract holds
        # A renamed or missing artifact would leave installed clients unable to
        # upgrade, and the failure would only surface on user machines. Assert
        # the names here instead.
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          cd dist
          missing=0
          for asset in \
            elasticclaw-linux-amd64 elasticclaw-linux-arm64 \
            elasticclaw-darwin-amd64 elasticclaw-darwin-arm64 \
            elasticclaw-windows-amd64.exe elasticclaw-windows-arm64.exe \
            elasticclaw-desktop-windows-amd64.exe elasticclaw-desktop-windows-arm64.exe \
            claw-bridge-linux-amd64 checksums.txt; do
            if [[ ! -f "$asset" ]]; then
              echo "::error::missing release asset: $asset"
              missing=1
            elif [[ "$asset" != checksums.txt ]] && ! grep -q " $asset\$" checksums.txt; then
              echo "::error::asset not listed in checksums.txt: $asset"
              missing=1
            fi
          done
          # The desktop app must carry an icon and version metadata; without the
          # resource it shows a blank taskbar icon and empty file Properties.
          # PE resources store text as UTF-16, so plain ASCII strings never
          # matches -- and the resource sits at the end of the file, so the output
          # must not be truncated either.
          if ! strings -a -el elasticclaw-desktop-windows-amd64.exe | grep -q "ElasticClaw"; then
            echo "::error::desktop exe has no version resource (icon/metadata missing)"
            missing=1
          fi
          # GitHub asset names are case-insensitive for uniqueness, so two assets
          # differing only in case fail at upload after the whole build has run.
          dupes="$(ls | tr 'A-Z' 'a-z' | sort | uniq -d)"
          if [[ -n "$dupes" ]]; then
            echo "::error::asset names collide case-insensitively: $dupes"
            missing=1
          fi
          # The Linux binary runs on this runner: confirm it reports the tag it
          # was built from rather than a stale or empty version string.
          reported="$(./elasticclaw-linux-amd64 version)"
          echo "built: $reported"
          if [[ "$reported" != *"$VERSION"* ]]; then
            echo "::error::binary reports '$reported', expected version $VERSION"
            missing=1
          fi
          exit $missing

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          notes_flag=(--generate-notes)
          # Tags like v1.2.0-beta.1 publish as prereleases so stable clients,
          # which only upgrade within their own track, are unaffected.
          prerelease_flag=()
          if [[ "$TAG" == *-* ]]; then
            prerelease_flag=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "$TAG" "${notes_flag[@]}" "${prerelease_flag[@]}"
          fi

  # The macOS and Linux desktop apps need cgo to link against WKWebView and
  # WebKitGTK, so neither can be cross-compiled from the ubuntu release job. Each is
  # built on its own platform and uploaded into the release the job above created,
  # which is why both wait for it.
  #
  # These jobs are the only verification these two binaries get: a compile and link
  # against the real system frameworks. Do not weaken them into `go vet`.
  desktop-macos:
    needs: release
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build the macOS desktop app
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          DESKTOP_TARGET: darwin
        run: ./scripts/build-release.sh

      - name: Check both architectures were produced and are Mach-O
        run: |
          missing=0
          for arch in amd64 arm64; do
            asset="dist/elasticclaw-desktop-darwin-${arch}"
            if [[ ! -f "$asset" ]]; then
              echo "::error::missing $asset"
              missing=1
              continue
            fi
            # An empty or wrong-format file would upload happily and fail on a user's
            # Mac, so confirm the linker actually produced a Mach-O executable.
            file "$asset" | grep -q 'Mach-O' || {
              echo "::error::$asset is not a Mach-O executable: $(file "$asset")"
              missing=1
            }
          done
          exit $missing

      - name: Upload into the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/elasticclaw-desktop-darwin-* --clobber

  desktop-linux:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # 4.1 rather than 4.0: 4.0 is not packaged for 24.04, and a binary linked
      # against it could not run on a current distribution anyway.
      - name: Install WebKitGTK
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev pkg-config xvfb

      - name: Build the Linux desktop app
        env:
          VERSION: ${{ github.event.inputs.tag || github.ref_name }}
          DESKTOP_TARGET: linux
        run: ./scripts/build-release.sh

      - name: Smoke test that the window opens
        run: |
          asset="dist/elasticclaw-desktop-linux-$(go env GOHOSTARCH)"
          test -f "$asset" || { echo "::error::missing $asset"; exit 1; }

          # A binary that compiles but aborts on startup is the failure this catches:
          # it starts the app against a virtual display, waits for the hub to answer
          # on its own port, and only then calls it a pass. Killing it afterwards is
          # expected and not a failure.
          export HOME="$(mktemp -d)"
          xvfb-run -a "$asset" &
          app_pid=$!

          ok=0
          for _ in $(seq 1 40); do
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "::error::the app exited on its own; log follows"
              cat "$HOME/.elasticclaw/desktop.log" 2>/dev/null || true
              exit 1
            fi
            for port in 8080 8081 8082 18080; do
              if curl -fsS -o /dev/null "http://127.0.0.1:${port}/login" 2>/dev/null; then
                echo "hub answered on ${port}"
                ok=1
                break
              fi
            done
            [ "$ok" = 1 ] && break
            sleep 3
          done

          kill "$app_pid" 2>/dev/null || true
          if [ "$ok" != 1 ]; then
            echo "::error::the app never served the dashboard; log follows"
            cat "$HOME/.elasticclaw/desktop.log" 2>/dev/null || true
            exit 1
          fi

      - name: Upload into the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: gh release upload "$TAG" dist/elasticclaw-desktop-linux-* --clobber

  # checksums.txt is generated by the release job before the macOS and Linux desktop
  # binaries exist, so those two would be absent from it — and both installers and
  # `elasticclaw upgrade` refuse to install an artifact that is not listed. This job
  # rebuilds the manifest over everything actually attached to the release.
  #
  # It needs both platform jobs rather than running alongside them: two jobs editing
  # one file in the release would race and the loser's hashes would vanish.
  checksums:
    # release is listed so needs.release.result can be read below; the platform jobs
    # are listed so this runs after them. always() lets the manifest still be
    # regenerated when one platform failed, so it correctly describes what shipped
    # rather than being left stale.
    needs: [release, desktop-macos, desktop-linux]
    if: always() && needs.release.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Regenerate checksums.txt across every release asset
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p assets && cd assets
          # Download everything except the manifest being replaced.
          gh release download "$TAG" --repo "$REPO" --pattern '*' --clobber
          rm -f checksums.txt

          # Same format the build script emits: sha256, two spaces, bare filename.
          sha256sum $(ls) > checksums.txt

          echo "checksums.txt now covers:"
          cut -d' ' -f3- checksums.txt | sed 's/^/  /'

          # Every asset must be listed, or a user's upgrade fails a verification it
          # cannot fix. Assert rather than trust the glob.
          missing=0
          for f in $(ls | grep -v '^checksums.txt$'); do
            grep -q "  ${f}\$" checksums.txt || { echo "::error::$f missing from checksums.txt"; missing=1; }
          done
          exit $missing

      - name: Upload the manifest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
          REPO: ${{ github.repository }}
        run: gh release upload "$TAG" assets/checksums.txt --clobber --repo "$REPO"
